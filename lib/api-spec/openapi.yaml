  /guilds/treasury/donate:
    post:
      operationId: donateToTreasury
      tags: [guilds]
      summary: Donate DC to guild treasury
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        "200":
          description: Donated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /guilds/promote:
    post:
      operationId: promoteGuildMember
      tags: [guilds]
      summary: Promote a guild member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId:
                  type: string
      responses:
        "200":
