      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guild list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: createGuild
      tags: [guilds]
      summary: Create a new guild
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag]
              properties:
                name:
                  type: string
                tag:
                  type: string
                description:
                  type: string
      responses:
