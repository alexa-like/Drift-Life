openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DriftLife API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: user
  - name: jobs
  - name: crimes
  - name: combat
  - name: market
  - name: bank
  - name: hospital
  - name: daily
  - name: feed
  - name: districts
  - name: leaderboard
  - name: notifications
  - name: inventory
  - name: owner
  - name: dev

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered; OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInput"
      responses:
        "200":
          description: Verified and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USER ────────────────────────────────────────────────────────────────
  /user/me:
    get:
      operationId: getMe
      tags: [user]
      summary: Get current player profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [user]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /user/{username}:
    get:
      operationId: getPlayerByTag
      tags: [user]
      summary: Get player by username
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlayer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/{userId}/follow:
    post:
      operationId: followPlayer
      tags: [user]
      summary: Follow a player
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /user/{userId}/unfollow:
    post:
      operationId: unfollowPlayer
      tags: [user]
      summary: Unfollow a player
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /user/me/avatar:
    post:
      operationId: generateAvatar
      tags: [user]
      summary: Generate AI avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarInput"
      responses:
        "200":
          description: Avatar URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"

  # ─── DISTRICTS ───────────────────────────────────────────────────────────
  /districts:
    get:
      operationId: getDistricts
      tags: [districts]
      summary: Get all districts with live data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: District list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"

  /districts/{districtId}/travel:
    post:
      operationId: travelToDistrict
      tags: [districts]
      summary: Travel to a district
      security:
        - bearerAuth: []
      parameters:
        - name: districtId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Travelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelResponse"
        "400":
          description: Not enough energy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── JOBS ────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: Get available jobs for current district
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job list with cooldown status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobWithStatus"

  /jobs/{jobId}/work:
    post:
      operationId: doJob
      tags: [jobs]
      summary: Work a job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "400":
          description: Not enough energy or on cooldown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── CRIMES ──────────────────────────────────────────────────────────────
  /crimes:
    get:
      operationId: getCrimes
      tags: [crimes]
      summary: Get available crimes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Crime list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrimeWithStatus"

  /crimes/{crimeId}/commit:
    post:
      operationId: commitCrime
      tags: [crimes]
      summary: Commit a crime
      security:
        - bearerAuth: []
      parameters:
        - name: crimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Crime result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrimeResult"
        "400":
          description: Not enough nerve or level requirement not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── COMBAT ──────────────────────────────────────────────────────────────
  /combat/npcs:
    get:
      operationId: getCombatNpcs
      tags: [combat]
      summary: Get NPCs in current district
      security:
        - bearerAuth: []
      responses:
        "200":
          description: NPC list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CombatNpc"

  /combat/npcs/{npcId}/fight:
    post:
      operationId: fightNpc
      tags: [combat]
      summary: Fight an NPC
      security:
        - bearerAuth: []
      parameters:
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Combat result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatResult"
        "400":
          description: Cannot fight (hospitalized, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /combat/targets:
    get:
      operationId: getPvpTargets
      tags: [combat]
      summary: Get eligible PvP targets in current district
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Target list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PvpTarget"

  /combat/attack:
    post:
      operationId: attackPlayer
      tags: [combat]
      summary: Attack another player
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId:
                  type: string
      responses:
        "200":
          description: PvP result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvpResult"
        "400":
          description: Cannot attack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── INVENTORY ───────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Get player inventory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/{itemId}/use:
    post:
      operationId: useItem
      tags: [inventory]
      summary: Use a consumable item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemUseResult"
        "400":
          description: Cannot use item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/{itemId}/equip:
    post:
      operationId: equipItem
      tags: [inventory]
      summary: Equip or unequip an item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item equipped/unequipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /inventory/{itemId}/salvage:
    post:
      operationId: salvageItem
      tags: [inventory]
      summary: Salvage item for DC
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Salvaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalvageResult"

  /inventory/salvage-all-commons:
    post:
      operationId: salvageAllCommons
      tags: [inventory]
      summary: Salvage all common items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commons salvaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalvageResult"

  /inventory/{itemId}/list:
    post:
      operationId: listInventoryItem
      tags: [inventory]
      summary: List an inventory item on the player market
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price:
                  type: number
      responses:
        "200":
          description: Listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /inventory/trade:
    post:
      operationId: tradeInventoryItem
      tags: [inventory]
      summary: Directly trade an item to another player
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, targetUserId]
              properties:
                itemId:
                  type: string
                targetUserId:
                  type: string
      responses:
        "200":
          description: Traded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── MARKET ──────────────────────────────────────────────────────────────
  /market/listings:
    get:
      operationId: getMarketListings
      tags: [market]
      summary: Get market listings
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketListing"
    post:
      operationId: createMarketListing
      tags: [market]
      summary: List item on market
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketListingInput"
      responses:
        "201":
          description: Listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketListing"
        "400":
          description: Cannot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/listings/{listingId}:
    delete:
      operationId: cancelMarketListing
      tags: [market]
      summary: Cancel a listing
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /market/listings/{listingId}/buy:
    post:
      operationId: buyMarketListing
      tags: [market]
      summary: Buy a market listing
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Not enough DC or listing gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/my-listings:
    get:
      operationId: getMyListings
      tags: [market]
      summary: Get my active listings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketListing"

  # ─── BANK ────────────────────────────────────────────────────────────────
  /bank/deposit:
    post:
      operationId: bankDeposit
      tags: [bank]
      summary: Deposit DC to bank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferInput"
      responses:
        "200":
          description: Deposited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBalance"
        "400":
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bank/withdraw:
    post:
      operationId: bankWithdraw
      tags: [bank]
      summary: Withdraw DC from bank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferInput"
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBalance"
        "400":
          description: Insufficient bank balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bank/balance:
    get:
      operationId: getBankBalance
      tags: [bank]
      summary: Get bank and wallet balances
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBalance"

  # ─── HOSPITAL ────────────────────────────────────────────────────────────
  /hospital/status:
    get:
      operationId: getHospitalStatus
      tags: [hospital]
      summary: Get hospitalization status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hospital status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HospitalStatus"

  /hospital/discharge:
    post:
      operationId: hospitalDischarge
      tags: [hospital]
      summary: Early paid discharge
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Discharged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Not hospitalized or not enough DC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hospital/use-item:
    post:
      operationId: hospitalUseItem
      tags: [hospital]
      summary: Use a healing item while hospitalized
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /hospital/heal:
    post:
      operationId: hospitalHeal
      tags: [hospital]
      summary: Pay DC to fully heal while hospitalized
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Healed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /hospital/release-early:
    post:
      operationId: hospitalReleaseEarly
      tags: [hospital]
      summary: Pay DC to release early from hospital (alias of discharge)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Not hospitalized or not enough DC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── DAILY REWARD ────────────────────────────────────────────────────────
  /daily/status:
    get:
      operationId: getDailyStatus
      tags: [daily]
      summary: Get daily reward status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daily reward status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStatus"

  /daily/claim:
    post:
      operationId: claimDaily
      tags: [daily]
      summary: Claim daily reward
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyClaimResult"
        "400":
          description: Already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── FEED ────────────────────────────────────────────────────────────────
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get social feed
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, faction, following]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
    post:
      operationId: createPost
      tags: [feed]
      summary: Create a manual post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPost"

  /feed/{postId}/react:
    post:
      operationId: reactToPost
      tags: [feed]
      summary: React to a post
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /feed/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [feed]
      summary: Get comments on a post
      security:
        - bearerAuth: []
