components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ComingSoon:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ─── AUTH SCHEMAS ──────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, username, password, faction]
      properties:
        email:
          type: string
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 8
        faction:
          type: string
          enum: [suits, street, grid]
        referralCode:
          type: string

    OtpInput:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
        otp:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, player]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        player:
          $ref: "#/components/schemas/Player"

    # ─── PLAYER SCHEMAS ────────────────────────────────────────────────
    Player:
      type: object
      required: [id, username, tag, faction, level, xp, xpToNext, dc, nc, bankBalance, strength, charisma, intelligence, streetCred, energy, maxEnergy, nerve, maxNerve, health, maxHealth, wantedLevel, hospitalized, currentDistrict, avatar, role, devMode]
      properties:
        id:
          type: string
        username:
          type: string
        tag:
          type: string
        email:
          type: string
        faction:
          type: string
        level:
          type: integer
        xp:
          type: integer
        xpToNext:
          type: integer
        prestige:
          type: integer
        skillPoints:
          type: integer
        dc:
          type: integer
        nc:
          type: integer
        bankBalance:
          type: integer
        strength:
          type: integer
        charisma:
          type: integer
        intelligence:
          type: integer
        streetCred:
          type: integer
        energy:
          type: integer
        maxEnergy:
          type: integer
        nerve:
          type: integer
        maxNerve:
          type: integer
        health:
          type: integer
        maxHealth:
          type: integer
        wantedLevel:
          type: integer
        hospitalized:
          type: boolean
        hospitalReleaseAt:
          type: ["string", "null"]
        currentDistrict:
          type: string
        avatar:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        equippedTitle:
          type: ["string", "null"]
        equippedFrame:
          type: ["string", "null"]
        equippedFrameRarity:
          type: ["string", "null"]
        equippedWeaponId:
          type: ["string", "null"]
        equippedClothingId:
          type: ["string", "null"]
        equippedVehicleId:
          type: ["string", "null"]
        role:
          type: string
        devMode:
          type: boolean
        titles:
          type: array
          items:
            type: string
        attacksToday:
          type: integer
        lastLoginAt:
          type: ["string", "null"]
        referralCode:
          type: string
        referralCount:
          type: integer

    PublicPlayer:
      type: object
      required: [id, username, tag, faction, level, currentDistrict, avatar]
      properties:
        id:
          type: string
        username:
          type: string
        tag:
          type: string
        faction:
          type: string
        level:
          type: integer
        xp:
          type: integer
        xpToNext:
          type: integer
        prestige:
          type: integer
        strength:
          type: integer
        charisma:
          type: integer
        intelligence:
          type: integer
        streetCred:
          type: integer
        currentDistrict:
          type: string
        avatar:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        equippedTitle:
          type: ["string", "null"]
        equippedFrame:
          type: ["string", "null"]
        equippedFrameRarity:
          type: ["string", "null"]
        titles:
          type: array
          items:
            type: string

    ProfileUpdate:
