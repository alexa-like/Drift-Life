<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, shrink-to-fit=no" />
    <script>
      // Android WebView wrappers (e.g. WebToApp) sometimes ignore the viewport
      // meta tag and render at a larger effective scale than a real mobile browser,
      // causing innerWidth < screen.width. This script detects that specific case
      // and corrects it by reducing initial-scale so the layout matches screen width.
      (function () {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;

        function fixViewport() {
          var vw = window.innerWidth;
          var sw = window.screen.width;
          if (sw <= 0 || vw <= 0) return;

          if (vw < sw - 40) {
            // Layout viewport is narrower than the screen — WebView has zoomed in.
            // Scale factor < 1 to zoom back out. Clamped to [0.1, 1] so we never
            // zoom in further or exceed normal 1:1 rendering.
            var scale = Math.min(1, Math.max(0.1, vw / sw));
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=' + scale.toFixed(3) +
              ', minimum-scale=0.1, maximum-scale=5.0, shrink-to-fit=no'
            );
          } else {
            // Normal state — restore default viewport settings.
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1.0, minimum-scale=1.0' +
              ', maximum-scale=5.0, shrink-to-fit=no'
            );
          }
        }

        fixViewport();
        window.addEventListener('load', fixViewport);
        // Re-check after orientation changes (portrait ↔ landscape)
        window.addEventListener('orientationchange', function () {
          setTimeout(fixViewport, 300);
        });
        window.addEventListener('resize', function () {
          setTimeout(fixViewport, 150);
        });
      })();
    </script>
    <title>DriftLife</title>
    <meta name="description" content="DriftLife — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
