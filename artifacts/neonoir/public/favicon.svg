<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="60%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1e1e2e" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#grid)" opacity="0.4"/>
  <rect x="48" y="48" width="928" height="928" rx="184" fill="none" stroke="#1e1e2e" stroke-width="16"/>
  <rect x="80" y="80" width="864" height="864" rx="160" fill="none" stroke="#00d4ff" stroke-width="4" stroke-opacity="0.25" filter="url(#neon)"/>

  <!-- Bold, unmistakable N -->
  <g filter="url(#neon)" stroke="url(#letter)" stroke-width="140" stroke-linecap="butt" stroke-linejoin="round" fill="none">
    <path d="M220 200 L220 824"/>
    <path d="M290 200 L774 824"/>
    <path d="M844 200 L844 824"/>
  </g>

  <!-- Subtle scanline -->
  <path d="M180 780 H844" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
</svg>
