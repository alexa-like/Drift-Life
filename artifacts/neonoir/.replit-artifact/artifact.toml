kind = "web"
previewPath = "/"
title = "DriftLife"
version = "1.0.0"
id = "artifacts/driftlife"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24576

[services.development]
run = "pnpm --filter @workspace/driftlife run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driftlife", "run", "build" ]
publicDir = "artifacts/driftlife/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24576"
BASE_PATH = "/"
